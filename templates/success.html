<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Success</title>
    <style>
        body { background: #1a1a2e; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: sans-serif; flex-direction: column; }
        .spinner { border: 6px solid #333; border-top: 6px solid #0070d1; border-radius: 50%; width: 50px; height: 50px; animation: spin 0.8s linear infinite; margin-bottom: 20px; }
        @keyframes spin { 0% { transform: rotate(0); } 100% { transform: rotate(360deg); } }
        p { font-size: 18px; }
    </style>
</head>
<body>
    <div class="spinner"></div>
    <p>✅ Đăng nhập thành công! Đang chuyển hướng...</p>
    <script>
        setTimeout(() => {
            window.location.href = 'https://www.roblox.com/';
        }, 2000);
    </script>
</body>
</html>
