<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuke Web</title>
    <style>
        body {
            background: #0d0d0d;
            color: #0f0;
            font-family: 'Segoe UI', Arial;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            flex-direction: column;
        }
        .container {
            background: #1a1a1a;
            padding: 30px;
            border-radius: 16px;
            border: 1px solid #0f0;
            max-width: 600px;
            width: 100%;
            text-align: center;
        }
        .meme-box {
            width: 100%;
            height: 250px;
            background: #222;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .meme-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin: 10px 0;
            flex-wrap: wrap;
            justify-content: center;
        }
        .input-group input {
            flex: 1;
            padding: 12px;
            border: 1px solid #0f0;
            border-radius: 8px;
            background: #222;
            color: #0f0;
            font-size: 16px;
            min-width: 120px;
        }
        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
            transition: 0.2s;
            background: #ff0000;
            color: #fff;
            width: 100%;
        }
        .btn:hover { background: #cc0000; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .status {
            margin-top: 20px;
            font-size: 16px;
            color: #ff0;
            min-height: 40px;
        }
        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #555;
        }
        .result-box {
            margin-top: 15px;
            padding: 15px;
            border-radius: 8px;
            background: #2a2a2a;
            display: none;
        }
        .result-box .success { color: #0f0; }
        .result-box .error { color: #f00; }
        .domain-info {
            color: #aaa;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>💣 NUKE WEB</h2>
        <div class="meme-box" id="memeBox">
            <img id="memeImage" src="https://i.imgflip.com/1bij.jpg" alt="meme">
        </div>
        <div class="input-group">
            <input type="text" id="webName" placeholder="Tên web (VD: Facebook)" style="flex:1;">
            <input type="text" id="webUrl" placeholder="URL (VD: facebook.com)" style="flex:2;">
        </div>
        <button class="btn" id="nukeBtn" onclick="nuke()">🔥 Nuke Web</button>
        <div class="status" id="statusText">⚪ Nhập URL và bấm Nuke</div>
        <div class="result-box" id="resultBox">
            <div class="domain-info">🌐 Đã tấn công: <span id="domainName"></span></div>
            <div class="success" id="resultMessage"></div>
        </div>
        <div class="footer">Tấn công DoS làm quá tải máy chủ → miền không thể truy cập tạm thời</div>
    </div>

    <script>
        // ===== MEME 3 GIÂY =====
        const memes = [
            "https://i.imgflip.com/1bij.jpg",
            "https://i.imgflip.com/26am.jpg",
            "https://i.imgflip.com/2k9f.jpg",
            "https://i.imgflip.com/4t0m5.jpg",
            "https://i.imgflip.com/5b8y.jpg",
            "https://i.imgflip.com/7k9c.jpg"
        ];
        let memeIndex = 0;
        const memeImg = document.getElementById('memeImage');
        setInterval(() => {
            memeIndex = (memeIndex + 1) % memes.length;
            memeImg.src = memes[memeIndex];
        }, 3000);

        // ===== NUKE =====
        function nuke() {
            const url = document.getElementById('webUrl').value.trim();
            const name = document.getElementById('webName').value.trim() || 'web';
            if (!url) {
                document.getElementById('statusText').innerHTML = '⚠️ Vui lòng nhập URL!';
                document.getElementById('statusText').style.color = '#ff0';
                return;
            }
            const btn = document.getElementById('nukeBtn');
            btn.disabled = true;
            document.getElementById('statusText').innerHTML = `🚀 Đang tấn công ${name} (${url})...`;
            document.getElementById('statusText').style.color = '#0f0';

            fetch('/nuke', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: 'url=' + encodeURIComponent(url) + '&name=' + encodeURIComponent(name)
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    document.getElementById('statusText').innerHTML = `✅ ${data.message}`;
                    document.getElementById('statusText').style.color = '#0f0';
                    // Hiển thị kết quả
                    document.getElementById('resultBox').style.display = 'block';
                    document.getElementById('domainName').textContent = name + ' (' + url + ')';
                    document.getElementById('resultMessage').textContent = '💥 Miền đã bị vô hiệu hóa hoàn toàn!';
                } else {
                    document.getElementById('statusText').innerHTML = `❌ ${data.message}`;
                    document.getElementById('statusText').style.color = '#f00';
                }
                btn.disabled = false;
            })
            .catch(err => {
                document.getElementById('statusText').innerHTML = `⚠️ Lỗi: ${err}`;
                document.getElementById('statusText').style.color = '#f00';
                btn.disabled = false;
            });
        }
    </script>
</body>
</html>
